<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A dynamic feedback app for Web Designing Lab Experiment 10.">
    <title>Dynamic Feedback App | Experiment 10</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="feedback-card">
        <header>
            <h1>Dynamic Feedback App</h1>
            <p>Experiment 10 - Node.js and Express Deployment</p>
        </header>

        <form id="feedback-form">
            <label for="name">Your Name</label>
            <input id="name" name="name" type="text" maxlength="100" placeholder="Enter your name" required>

            <label for="feedback">Your Feedback</label>
            <textarea id="feedback" name="feedback" maxlength="1000" rows="4" placeholder="Write your feedback" required></textarea>

            <button type="submit">Submit Feedback</button>
            <p id="feedback-status" class="status" role="status" aria-live="polite"></p>
        </form>

        <nav class="api-links" aria-label="API links">
            <a href="/api/health" target="_blank" rel="noopener noreferrer">Check Server Health</a>
            <a href="/api/feedback" target="_blank" rel="noopener noreferrer">View Submitted Feedback (JSON)</a>
        </nav>
    </main>
    <script src="app.js"></script>
</body>
</html>
